services:
  database:
    image: mysql:8.0
    container_name: proyecto_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: tu_contraseña_segura
      MYSQL_DATABASE: proyecto_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../Data_Devops/01_creacion_base_datos.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - red_innovatech_global

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proyecto_backend_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: database
      DB_USER: root
      DB_PASSWORD: tu_contraseña_segura
      DB_NAME: proyecto_db
      DB_PORT: 3306
    depends_on:
      - database
    networks:
      - red_innovatech_global

volumes:
  mysql_data:

networks:
  red_innovatech_global:
    external: true 